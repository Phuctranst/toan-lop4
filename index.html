<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Luyện thi Toán lớp 4 – Ôn tập vui</title>
<style>
:root{--bg1:#fff8e1;--bg2:#e3f6ff;--ink:#2b3a55;--blue:#4dabf7;--blue-d:#1c7ed6;--yellow:#ffe066;--green:#51cf66;--green-l:#e6fcf0;--red:#ff6b6b;--red-l:#fff0f0;--orange:#ffa94d;--orange-l:#fff4e0;--card:#fff;--line:#d9e8f5}
*{box-sizing:border-box}
body{margin:0;font-family:"Nunito","Quicksand","Segoe UI",Tahoma,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;font-size:18px;line-height:1.55}
header.top{background:linear-gradient(90deg,#74c0fc,#ffd43b);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 3px 10px #0001;position:sticky;top:0;z-index:5}
header.top .hleft,header.top .hright{display:flex;align-items:center;gap:8px;flex:1}
header.top .hright{justify-content:flex-end}
header.top h1{margin:0;font-size:1.3rem;color:#16365c;text-align:center;flex:none}
header.top button,.wname{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;background:#fff;border:0;border-radius:18px;padding:0 14px;font:inherit;font-size:.9rem;font-weight:700;cursor:pointer;color:var(--blue-d);white-space:nowrap}
.wrap{max-width:900px;margin:0 auto;padding:18px 14px 80px}
.hero{text-align:center;margin:10px 0 22px}
.hero h2{margin:0;font-size:1.8rem}
.hero p{margin:6px 0}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.ecard{background:var(--card);border-radius:22px;padding:18px;box-shadow:0 6px 18px #4dabf722;border:3px solid transparent;transition:.2s}
.ecard:hover{transform:translateY(-4px);border-color:var(--yellow)}
.ecard h3{margin:0 0 6px;font-size:1.25rem}
.ecard .big{font-size:2.4rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{background:#eef7ff;border-radius:14px;padding:2px 10px;font-size:.8rem}
.btn{background:var(--blue);color:#fff;border:0;border-radius:24px;padding:10px 22px;font:inherit;font-weight:800;cursor:pointer;box-shadow:0 4px 0 var(--blue-d)}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.green{background:var(--green);box-shadow:0 4px 0 #2f9e44}
.btn.orange{background:var(--orange);box-shadow:0 4px 0 #e8590c}
.btn.ghost{background:#fff;color:var(--blue-d);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.bdg{display:inline-flex;align-items:center;gap:6px;background:#fff9db;border:2px solid #ffd43b;border-radius:20px;padding:3px 12px 3px 6px;margin:4px;font-weight:700;font-size:.9rem}.bdg i{font-style:normal;font-size:1.3rem}.bdg.off{filter:grayscale(1);opacity:.4;border-color:#ced4da;background:#f1f3f5}.shelf{background:#fff;border-radius:20px;padding:12px 16px;margin:20px 0;box-shadow:0 4px 12px #0000000d}.star{color:#fab005;letter-spacing:2px}.newb{background:#fff9db;border:3px dashed #fab005;border-radius:18px;padding:10px 14px;margin:10px 0;animation:pop .6s}@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}.best{font-size:.85rem;color:#868e96;margin-top:6px}
.bar{position:sticky;top:58px;z-index:4;background:#ffffffe8;border-radius:16px;padding:8px 14px;margin:10px 0;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px #0001}
.bar .track{flex:1;height:12px;background:#e9ecef;border-radius:8px;overflow:hidden}
.bar .fill{height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--yellow));transition:.3s}
.q{background:var(--card);border-radius:20px;padding:16px 18px;margin:14px 0;box-shadow:0 4px 12px #0000000d;border-left:8px solid var(--blue)}
.q.ok{border-left-color:var(--green);background:#fbfffc}
.q.bad{border-left-color:var(--red);background:#fffcfc}
.q.part{border-left-color:var(--orange);background:#fffdf8}
.qh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.qn{background:var(--yellow);border-radius:12px;padding:1px 12px}
.tp{font-size:.8rem;background:#eef7ff;border-radius:12px;padding:2px 10px}
.qt{margin:8px 0}
.opt{display:flex;align-items:center;gap:10px;padding:8px 12px;margin:6px 0;border:2px solid var(--line);border-radius:14px;cursor:pointer;background:#fcfeff}
.opt:hover{border-color:var(--blue)}
.opt input{display:none}
.opt .lt{width:30px;height:30px;border-radius:50%;background:#e7f5ff;display:inline-flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.opt:has(input:checked){border-color:var(--blue);background:#e7f5ff}
.opt:has(input:checked) .lt{background:var(--blue);color:#fff}
.opt.right{border-color:var(--green)!important;background:var(--green-l)!important}
.opt.right .lt{background:var(--green)!important;color:#fff}
.opt.wrong{border-color:var(--red)!important;background:var(--red-l)!important}
.opt.wrong .lt{background:var(--red)!important;color:#fff}
.locked{pointer-events:none}
.pick{display:flex;flex-wrap:wrap;gap:10px}
.pick .opt{margin:0;min-width:110px;justify-content:center}
.pick .opt.missed{border-style:dashed;border-color:var(--orange);background:var(--orange-l)}
.tfrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0;padding:6px 0;border-bottom:1px dashed var(--line)}
.tfrow .tt{flex:1;min-width:220px}
.tfrow .opt{margin:0;padding:4px 14px}
.frow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0}
.frow input,.frow select{font:inherit;font-weight:700;padding:6px 10px;border:2px solid var(--line);border-radius:12px;width:150px;text-align:center;color:var(--ink);background:#fff}
.frow select{width:80px}
.frow input:focus,.frow select:focus{outline:0;border-color:var(--blue)}
.frow input.ok,.frow select.ok{border-color:var(--green);background:var(--green-l)}
.frow input.bad,.frow select.bad{border-color:var(--red);background:var(--red-l)}
.fb{margin-top:10px}
.verdict{font-weight:800;margin-bottom:4px}
.ok .verdict{color:#2b8a3e}.bad .verdict{color:#e03131}.part .verdict{color:#d9480f}
.ex{background:#fffbe6;border:2px dashed #ffd43b;border-radius:14px;padding:8px 12px;margin-top:8px}
.fb ul{margin:4px 0;padding-left:20px}
.fb details{margin-top:6px;font-size:.95rem}
.fb summary{cursor:pointer;color:var(--blue-d);font-weight:700}
.sub{display:flex;justify-content:center;margin:26px 0}
.result{background:#fff;border-radius:26px;padding:20px;margin:14px 0;box-shadow:0 8px 24px #4dabf733;border:4px solid var(--yellow)}
.score{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.circle{width:130px;height:130px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:conic-gradient(var(--green) calc(var(--p)*1%),#e9ecef 0);position:relative;flex:none}
.circle::before{content:"";position:absolute;inset:12px;background:#fff;border-radius:50%}
.circle b,.circle span{position:relative}
.circle b{font-size:2rem;line-height:1}
.tbar{display:flex;align-items:center;gap:10px;margin:8px 0;flex-wrap:wrap}
.tbar .nm{width:230px;font-weight:700}
.tbar .tr{flex:1;min-width:120px;height:16px;background:#e9ecef;border-radius:10px;overflow:hidden}
.tbar .tr i{display:block;height:100%}
.good i{background:var(--green)}.mid i{background:var(--orange)}.low i{background:var(--red)}
.tag{font-size:.85rem;border-radius:12px;padding:2px 10px;font-weight:800}
.good .tag{background:var(--green-l);color:#2b8a3e}.mid .tag{background:var(--orange-l);color:#d9480f}.low .tag{background:var(--red-l);color:#e03131}
.panel{border-radius:18px;padding:12px 16px;margin:10px 0}
.panel.g{background:var(--green-l)}.panel.w{background:var(--orange-l)}
.practice{background:#f3f0ff;border:3px dashed #b197fc;border-radius:22px;padding:14px;margin:20px 0}
.practice h3{margin:0}
svg.fig{display:block;margin:8px auto;max-width:100%;background:#f8fdff;border-radius:14px;border:2px solid var(--line)}
.who{display:flex;align-items:center;gap:8px}.who #pwBtn{width:36px;padding:0}.wname{background:#ffffffd9;color:#16365c;cursor:default}
.loginbox{max-width:380px;margin:30px auto;background:#fff;border-radius:26px;padding:22px;text-align:center;box-shadow:0 8px 24px #4dabf733;border:4px solid var(--yellow)}.loginbox input{display:block;width:100%;font:inherit;padding:10px 14px;margin:10px 0;border:2px solid var(--line);border-radius:14px}.loginbox input:focus{outline:0;border-color:var(--blue)}.lerr{color:#e03131;font-weight:700;min-height:1.4em;margin:6px 0}.lwarn{background:var(--orange-l);border-radius:12px;padding:8px 12px;font-size:.9rem}
.timer{font-weight:800;background:#e7f5ff;color:var(--blue-d);border-radius:14px;padding:2px 12px;white-space:nowrap}.timer.warn{background:var(--orange-l);color:#d9480f}.timer.danger{background:var(--red-l);color:#e03131;animation:blink 1s infinite}@keyframes blink{50%{opacity:.5}}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.tab{border:2px solid var(--line);background:#fff;border-radius:18px;padding:6px 14px;font:inherit;font-weight:700;cursor:pointer;color:var(--ink)}.tab.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.stats{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:10px 0}.stats div{background:#fff;border-radius:18px;padding:10px;text-align:center;box-shadow:0 3px 10px #0000000d;font-size:.9rem}.stats b{display:block;font-size:1.4rem;color:var(--blue-d)}
.card2{background:#fff;border-radius:20px;padding:14px 16px;margin:12px 0;box-shadow:0 4px 12px #0000000d}.card2 h3{margin:0 0 8px}
.tbl{border-collapse:collapse;width:100%;font-size:.9rem;margin-top:8px}.tbl th{background:#e7f5ff;text-align:left;padding:6px 10px;white-space:nowrap}.tbl td{padding:6px 10px;border-bottom:1px solid #edf2f7;vertical-align:top}.nw{white-space:nowrap}.small{font-size:.78rem;color:#868e96}
.lv{border-radius:12px;padding:1px 10px;font-weight:800;font-size:.85rem}.lv.good{background:var(--green-l);color:#2b8a3e}.lv.mid{background:var(--orange-l);color:#d9480f}.lv.low{background:var(--red-l);color:#e03131}
.mini{border:0;border-radius:12px;padding:3px 10px;font:inherit;font-size:.78rem;font-weight:700;cursor:pointer;background:#e7f5ff;color:var(--blue-d)}.mini.red{background:var(--red-l);color:#e03131}
.hb{margin-top:8px}.hbrow{display:flex;align-items:center;gap:10px;margin:6px 0}.hbl{width:180px;font-weight:700;font-size:.9rem}.hbt{flex:1;height:16px;background:#e9ecef;border-radius:10px;overflow:hidden}.hbt i{display:block;height:100%;background:linear-gradient(90deg,#74c0fc,#51cf66)}
svg.vb{width:100%;max-width:700px;display:block}.addf{display:flex;flex-wrap:wrap;gap:10px}.addf input{font:inherit;padding:8px 12px;border:2px solid var(--line);border-radius:12px;flex:1;min-width:160px}.adm select{font:inherit;padding:4px 8px;border-radius:10px;border:2px solid var(--line)}

.navp{display:block;position:fixed;right:14px;top:calc(var(--hh,68px) + 10px);width:200px;max-height:calc(100vh - var(--hh,68px) - 24px);overflow:auto;z-index:4;padding:12px;border-radius:18px;box-shadow:0 6px 20px #4dabf744;border:3px solid var(--yellow);background:#fff}
.navp .navh{font-weight:800;margin-bottom:8px;text-align:center}.navp .navt{text-align:center;margin-bottom:6px}.navp .timer{font-size:1.15rem;display:inline-block}.navp .navc{font-size:.85rem;margin:4px 0}.navp .track{height:10px;margin-bottom:10px}
.ngrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.nb{width:100%;aspect-ratio:1;min-width:28px;border:2px solid var(--line);background:#fff;border-radius:10px;font:inherit;font-weight:800;font-size:.8rem;cursor:pointer;color:var(--ink);padding:0}
.nb:hover{border-color:var(--blue)}.nb.done{background:var(--green);border-color:#2f9e44;color:#fff}
.nleg{display:flex;flex-direction:column;gap:3px;font-size:.78rem;margin:10px 0}.nleg i.nb{display:inline-block;width:14px;min-width:14px;height:14px;aspect-ratio:auto;vertical-align:middle;margin-right:4px;border-radius:4px;cursor:default}
.navp .btn{width:100%;padding:8px}
.q.flash{animation:flashq 1.4s}@keyframes flashq{0%,60%{box-shadow:0 0 0 5px #ffd43b}100%{box-shadow:0 4px 12px #0000000d}}
@media(min-width:1100px) and (max-width:1360px){body.has-nav .wrap{max-width:1120px;margin:0 auto;padding-right:226px}.navp{right:max(14px,calc(50% - 560px))}}
@media(min-width:1361px){body.has-nav .wrap{max-width:900px;margin:0 auto}.navp{right:max(14px,calc(50% - 670px))}}
@media(max-width:1099px){.navp{position:sticky;top:calc(var(--hh,68px) + 6px);right:auto;width:auto;max-height:none;overflow:visible;margin:6px 0;padding:5px 10px;border-width:2px;border-radius:14px;display:flex;align-items:center;gap:8px}.navp .nleg,.navp .track{display:none}.navp .navh{margin:0;flex:none;font-size:0;order:1}.navp .navh::after{content:"📋 Bài thi";font-size:.82rem;font-weight:800;color:var(--blue-d);background:#e7f5ff;padding:2px 8px;border-radius:10px;white-space:nowrap}.navp .navc{margin:0;flex:none;font-size:.75rem;white-space:nowrap;order:2}.ngrid{display:flex;gap:4px;flex:1;overflow-x:auto;padding:2px 0;scrollbar-width:none;order:3}.ngrid::-webkit-scrollbar{display:none}.navp .navt{margin:0 0 0 auto;flex:none;order:4}.navp .timer{font-size:.85rem;padding:2px 8px}.nb{flex:none;width:26px;min-width:26px;height:26px;aspect-ratio:auto;border-radius:8px;font-size:.72rem;border-width:1.5px}}
@media print{header.top,.bar,.sub,.btn{display:none}}
</style>
</head>
<body>
<header class="top"><div class="hleft"><button id="homeBtn" style="display:none">🏠 Trang chủ</button><span class="who" id="who"></span></div><h1>🎒 Ôn tập Toán lớp 4 – Học mà vui</h1><div class="hright" id="hright"></div></header>
<main class="wrap" id="app"></main>

<script>
/* ================= TIỆN ÍCH ================= */
function rng(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=(r,a,b)=>a+Math.floor(r()*(b-a+1));
const pick=(r,a)=>a[Math.floor(r()*a.length)];
function shuffle(r,a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const fmt=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'\u00a0');
const POS=['đơn vị','chục','trăm','nghìn','chục nghìn','trăm nghìn','triệu','chục triệu','trăm triệu'];
const CLS=p=>p<3?'đơn vị':p<6?'nghìn':'triệu';
const TOPICS={
 place:{name:'Hàng & lớp của số',icon:'🔢',tip:'Đếm hàng từ PHẢI sang TRÁI: đơn vị, chục, trăm | nghìn, chục nghìn, trăm nghìn | triệu… Cứ 3 hàng là 1 lớp. Giá trị của chữ số = chữ số × giá trị của hàng.'},
 parity:{name:'Số chẵn – số lẻ & dãy số',icon:'🧩',tip:'Chỉ nhìn chữ số tận cùng: 0,2,4,6,8 là số chẵn; 1,3,5,7,9 là số lẻ. Hai số chẵn (hoặc lẻ) liên tiếp hơn kém nhau 2.'},
 round:{name:'Làm tròn số',icon:'🎯',tip:'Muốn làm tròn đến hàng nào, hãy nhìn chữ số NGAY BÊN PHẢI hàng đó: bé hơn 5 thì giữ nguyên, từ 5 trở lên thì cộng thêm 1; các chữ số bên phải đổi thành 0.'},
 expr:{name:'Biểu thức & tính thuận tiện',icon:'🧮',tip:'Nhân, chia làm trước – cộng, trừ làm sau; cùng cấp thì từ trái sang phải. Tính thuận tiện: ghép các số có tổng tròn chục, tròn trăm, tròn nghìn.'},
 unit:{name:'Đổi & so sánh đơn vị đo',icon:'⚖️',tip:'1 yến = 10 kg; 1 tạ = 100 kg; 1 tấn = 1000 kg; 1 m² = 100 dm²; 1 thế kỉ = 100 năm; 1 ngày = 24 giờ. Muốn so sánh, hãy đưa về CÙNG một đơn vị.'},
 angle:{name:'Góc & đồng hồ',icon:'📐',tip:'Góc nhọn < 90° ; góc vuông = 90° ; góc tù từ 90° đến 180° ; góc bẹt = 180°. Dùng ê ke để kiểm tra góc vuông.'},
 calc:{name:'Đặt tính rồi tính',icon:'✏️',tip:'Cộng, trừ, nhân: viết thẳng hàng, tính từ phải sang trái, nhớ "nhớ" và "mượn". Chia: chia từ trái sang phải. Luôn thử lại bằng phép tính ngược.'},
 area:{name:'Đơn vị đo diện tích',icon:'🟦',tip:'1 m² = 100 dm²; 1 dm² = 100 cm²; 1 cm² = 100 mm² (mỗi bậc gấp 100 lần). Diện tích hình chữ nhật = dài × rộng, cùng đơn vị.'},
 avg:{name:'Trung bình cộng',icon:'⚖️',tip:'Trung bình cộng = tổng các số : số các số hạng. Nhớ kiểm tra lại: trung bình × số số hạng phải bằng tổng.'},
 sumdiff:{name:'Tìm hai số khi biết tổng và hiệu',icon:'🤝',tip:'Số lớn = (tổng + hiệu) : 2; số bé = (tổng − hiệu) : 2. Luôn thử lại: hai số cộng lại bằng tổng, trừ nhau bằng hiệu.'},
 word:{name:'Bài toán có lời văn',icon:'📖',tip:'Đọc kĩ đề, gạch chân điều đã cho và điều cần tìm. Làm từng bước nhỏ, ghi lời giải + phép tính + đáp số, nhớ đổi đơn vị ở cuối.'}
};

/* ================= TẠO CÂU HỎI ================= */
function mcq(r,o){
 const items=[{t:o.right[0],why:o.right[1],ok:true}],seen=new Set([o.right[0]]);
 for(const w of o.wrong){if(!seen.has(w[0])){seen.add(w[0]);items.push({t:w[0],why:w[1]})}if(items.length==4)break}
 const sh=shuffle(r,items);
 return {topic:o.topic,kind:'mcq',text:o.text,svg:o.svg||'',opts:sh,ans:sh.findIndex(x=>x.ok),explain:o.explain};
}
function gPlaceValue(r){
 const digs=shuffle(r,[1,2,3,4,5,6,7,8,9]).slice(0,6),n=+digs.join('');
 const pos=R(r,1,5),d=digs[5-pos],v=d*10**pos;
 return mcq(r,{topic:'place',text:`Giá trị của chữ số <b>${d}</b> trong số <b>${fmt(n)}</b> là:`,
  right:[fmt(v),`Chữ số ${d} đứng ở hàng ${POS[pos]}, nên giá trị là ${d} ${POS[pos]} = ${fmt(v)}.`],
  wrong:[[fmt(d*10**(pos-1)),`Giá trị này chỉ đúng nếu chữ số ${d} ở hàng ${POS[pos-1]}. Em đếm thiếu 1 hàng rồi!`],
   [fmt(d*10**(pos+1)),`Giá trị này ứng với hàng ${POS[pos+1]}. Em đếm thừa 1 hàng rồi!`],
   [String(d),`Đây chỉ là chữ số ${d}. Giá trị còn phải nhân với giá trị của hàng.`],
   [fmt(d*10**(pos+2)),`Quá lớn: chữ số ${d} không đứng ở hàng ${POS[pos+2]}.`]],
  explain:`Đếm hàng từ phải sang trái: đơn vị → chục → trăm → nghìn → chục nghìn → trăm nghìn. Trong ${fmt(n)}, chữ số ${d} ở hàng ${POS[pos]} nên giá trị = ${d} × ${fmt(10**pos)} = ${fmt(v)}.`});
}
function gPlaceClass(r){
 const digs=shuffle(r,[1,2,3,4,5,6,7,8,9]),n=+digs.join(''),pos=R(r,3,8),d=digs[8-pos];
 const lab=p=>`Hàng ${POS[p]}, lớp ${CLS(p)}`;
 const otherCls=['đơn vị','nghìn','triệu'].filter(x=>x!=CLS(pos))[0];
 const others=shuffle(r,[0,1,2,3,4,5,6,7,8].filter(x=>x!=pos));
 const s=String(n);

  case 'result':db.results.push({ts:now,username:user,name:me.name,exam:q.exam,title:q.title,score:q.score,seconds:q.seconds,allowed:q.allowed,timeout:!!q.timeout,topics:JSON.stringify(q.topics||{})});log(user,'submit_exam',q.title+' – '+q.score+'/10');if(ur&&q.profile)ur.profile=q.profile;break;
  case 'changePass':if(ur)ur.hash=q.newHash;break;
  case 'adminData':if(!adm)return{ok:false,error:'forbidden'};return{ok:true,users:db.users.map(u=>({username:u.username,name:u.name,created:u.created,lastLogin:u.lastLogin})),results:db.results,logs:db.logs.slice(-1500),activity:db.activity};
  case 'addUser':{if(!adm)return{ok:false,error:'forbidden'};const u=q.u||{};if(!/^[a-z0-9_.]{3,20}$/.test(u.username||'')||u.username==='admin')return{ok:false,error:'Tên đăng nhập 3–20 ký tự (chữ thường, số, _ .)'};if(db.users.some(x=>x.username===u.username))return{ok:false,error:'Tên đăng nhập đã tồn tại'};db.users.push({username:u.username,name:u.name||u.username,hash:u.hash,profile:null,created:now,lastLogin:0});break}
  case 'resetPass':{if(!adm)return{ok:false,error:'forbidden'};const t=db.users.find(x=>x.username===q.target);if(t)t.hash=q.newHash;break}
  case 'delUser':{if(!adm)return{ok:false,error:'forbidden'};db.users=db.users.filter(x=>x.username!==q.target);break}
 }
 save();return{ok:true};
}

const OB='toan4_outbox';let flushing=false;
function queue(action,payload){
 let q=[];try{q=JSON.parse(localStorage.getItem(OB)||'[]')}catch(e){}
 q.push(Object.assign({action,ts:Date.now(),user:SES&&SES.user,hash:SES&&SES.hash},payload||{}));
 localStorage.setItem(OB,JSON.stringify(q));flush();
}
async function flush(){
 if(flushing)return;flushing=true;
 try{let q=JSON.parse(localStorage.getItem(OB)||'[]');
  while(q.length){
   try{const res=API_URL?await(await fetch(API_URL,{method:'POST',body:JSON.stringify(q[0])})).json():await localApi(q[0]);void res}catch(e){break}
   q.shift();localStorage.setItem(OB,JSON.stringify(q));
  }}catch(e){}finally{flushing=false}
}

function tabChart(b,d,per){
 const days=[];for(let i=13;i>=0;i--){const x=new Date();x.setDate(x.getDate()-i);days.push({key:dayKey(x.getTime()),label:String(x.getDate()).padStart(2,'0')+'/'+String(x.getMonth()+1).padStart(2,'0')})}
 const items=days.map(dd=>({label:dd.label,value:Math.round(d.activity.filter(a=>+a.day===dd.key&&(!ADM.sel||a.username===ADM.sel)).reduce((s,a)=>s+ +a.minutes,0))}));
 const ps=Object.values(per);
 b.innerHTML=`<div class="card2"><h3>⏱ Thời gian học 14 ngày gần đây (phút)</h3><label>Xem: <select id="fsel">${userOpts(d,ADM.sel)}</select></label>${vbar(items,'phút')}</div>
 <div class="card2"><h3>🧑‍🎓 Tổng thời gian học theo học sinh (phút)</h3>${hbar(ps.map(p=>({label:p.u.name,value:Math.round(p.study)})),v=>fmtMin(v))}</div>
 <div class="card2"><h3>🎯 Điểm trung bình theo học sinh (thang 10)</h3>${hbar(ps.filter(p=>p.attempts).map(p=>({label:p.u.name,value:Math.round(p.sum/p.attempts*10)/10})),v=>v,10)}</div>
 <div class="card2"><h3>📝 Thời gian làm bài theo học sinh</h3>${hbar(ps.map(p=>({label:p.u.name,value:Math.round(p.sec/60)})),v=>fmtMin(v))}</div>`;
 b.querySelector('#fsel').onchange=e=>{ADM.sel=e.target.value;renderAdmin()};
}
function tabAdd(b){
 b.innerHTML=`<div class="card2"><h3>➕ Tạo tài khoản học sinh</h3><div class="addf"><input id="au" placeholder="Tên đăng nhập (vd: an01)"><input id="an" placeholder="Họ và tên"><input id="ap" placeholder="Mật khẩu (≥ 4 ký tự)"><button class="btn green" id="ago">Tạo</button></div><div id="amsg" class="lerr"></div><p class="small">Tên đăng nhập gồm chữ thường không dấu, số, dấu _ hoặc . (3–20 ký tự). Em có thể tự đổi mật khẩu bằng nút 🔑 sau khi đăng nhập.</p></div>`;
 b.querySelector('#ago').onclick=async()=>{
  const u=b.querySelector('#au').value.trim().toLowerCase(),n=b.querySelector('#an').value.trim(),p=b.querySelector('#ap').value,m=b.querySelector('#amsg');
  if(!/^[a-z0-9_.]{3,20}$/.test(u)){m.textContent='Tên đăng nhập chưa hợp lệ.';return}
  if(!n){m.textContent='Hãy nhập họ tên.';return}
  if(p.length<4){m.textContent='Mật khẩu cần ít nhất 4 ký tự.';return}
  m.textContent='⏳ Đang tạo…';
  try{const r=await api('addUser',{u:{username:u,name:n,hash:await hashOf(u,p)}});if(r.ok){ADM.tab='stu';adminView()}else m.textContent='❌ '+(r.error||'Lỗi')}catch(e){m.textContent='❌ Không kết nối được máy chủ.'}
 };
}

let S={ex:null,variant:0,qs:[],done:false};
const best=id=>+localStorage.getItem(UK('best_'+id))||null;
const stars=s=>s>=9?3:s>=7?2:s>=5?1:0;
const starTxt=n=>'★'.repeat(n)+'☆'.repeat(3-n);
const BADGE={first:['🎒','Bước đầu tiên','Hoàn thành 1 đề'],pro:['🏆','Xuất sắc','Đạt từ 9 điểm trở lên'],full:['💯','Điểm 10','Đạt 10 điểm tròn'],all:['🌈','Chinh phục 3 đề','Hoàn thành cả 3 đề'],improve:['📈','Tiến bộ','Làm lại và đạt điểm cao hơn lần trước'],practice:['💪','Chăm luyện','Đạt từ 70% bài củng cố']};
Object.keys(TOPICS).forEach(k=>BADGE['m_'+k]=[TOPICS[k].icon,'Giỏi: '+TOPICS[k].name,'Làm đúng hết các câu của phần này']);
const myBadges=()=>{try{return JSON.parse(localStorage.getItem(UK('badges'))||'[]')}catch(e){return[]}};
function award(ids){const have=myBadges(),nw=ids.filter(i=>BADGE[i]&&!have.includes(i));if(nw.length)localStorage.setItem(UK('badges'),JSON.stringify(have.concat(nw)));return nw}
const badgeHTML=(ids,all)=>Object.keys(BADGE).filter(i=>all||ids.includes(i)).map(i=>`<span class="bdg ${ids.includes(i)?'':'off'}" title="${BADGE[i][2]}"><i>${BADGE[i][0]}</i>${BADGE[i][1]}</span>`).join('');

function home(){
 clearInterval(S.timer);renderWho();
 homeBtn.style.display='none';app.innerHTML='';
 app.append(h('div','hero',`<div style="font-size:3rem">📚✨</div><h2>Chào bạn! Chọn một đề để luyện nhé</h2><p>Mỗi đề có 14–15 câu. Làm xong bấm <b>Nộp bài</b> để xem điểm, lời giải và bài luyện tập riêng cho bạn.</p>`));
 const g=h('div','grid');
 EXAMS.forEach(ex=>{
  const topics=[...new Set(ex.plan.map(p=>p[0](rng(1),p[1]).topic))];
  const c=h('div','ecard',`<div class="big">${ex.icon}</div><h3>${ex.title}</h3><div>${ex.desc}</div><div class="chips">${topics.map(t=>`<span class="chip">${TOPICS[t].icon} ${TOPICS[t].name}</span>`).join('')}</div><button class="btn">Bắt đầu ▶</button><div class="best">${best(ex.id)!=null?'🏆 Điểm cao nhất: '+best(ex.id)+'/10':'Chưa làm lần nào'}</div><div class="star">${starTxt(stars(best(ex.id)||0))}</div>`);
  c.querySelector('button').onclick=()=>start(ex,0);g.append(c);
 });
 app.append(g);
 const mb=myBadges();app.append(h('div','shelf',`<b>🎖️ Bộ sưu tập huy hiệu (${mb.length}/${Object.keys(BADGE).length})</b><div>${badgeHTML(mb,true)}</div><div class="best">Di chuột vào huy hiệu để xem cách nhận.</div>`));
}
homeBtn.onclick=()=>SES&&SES.role==='admin'?adminView():home();

function start(ex,variant){
 clearInterval(S.timer);S={ex,variant,qs:makeExam(ex,variant),done:false};S.allowed=S.qs.reduce((a,q)=>a+qMin(q),0)*60;S.t0=Date.now();
 homeBtn.style.display='';app.innerHTML='';window.scrollTo(0,0);if(typeof syncH==='function')setTimeout(syncH,10);
 app.append(h('div','hero',`<h2>${ex.icon} ${ex.title}${variant?' (số liệu mới #'+variant+')':''}</h2><p>Khoanh/chọn/điền đáp án. Cố gắng hết sức nhé! 💪</p><p>⏱ Thời gian làm bài: <b>${Math.round(S.allowed/60)} phút</b> (trắc nghiệm 2 phút/câu, điền số 3 phút/câu, bài lời văn và đặt tính 5 phút/câu). Hết giờ bài sẽ tự nộp.</p>`));
 const bar=h('div','bar navp',`<div class="navh">📋 Điều hướng bài thi</div><div class="navt"><span class="timer" id="tm">⏱ --:--</span></div><div class="navc"><b id="pc">0/${S.qs.length}</b> câu đã làm</div><div class="track"><div class="fill" id="pf"></div></div><div class="ngrid">${S.qs.map((q,i)=>`<button type="button" class="nb" id="nb${i}" title="Đến câu ${i+1}">${i+1}</button>`).join('')}</div><div class="nleg"><span><i class="nb done"></i> Đã làm</span><span><i class="nb"></i> Chưa làm</span></div>`);
 document.body.classList.add('has-nav');
 bar.querySelectorAll('.ngrid .nb').forEach((bt,i)=>bt.onclick=()=>{const t=S.qs[i].card;t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')});
 app.append(bar);
 const list=h('div');list.id='qs';app.append(list);
 S.qs.forEach((q,i)=>renderQ(q,i,list,'e'));
 const sub=h('div','sub','<button class="btn green" id="submit">✅ Nộp bài</button>');app.append(sub);
 document.getElementById('submit').onclick=()=>submit(false);startTimer();queue('log',{event:'start_exam',detail:ex.title});
 app.addEventListener('input',upd);app.addEventListener('change',upd);
}
function upd(){
 if(S.done)return;const n=S.qs.filter(q=>q.answered()).length;S.qs.forEach((q,i)=>{const b=document.getElementById('nb'+i);if(b)b.classList.toggle('done',q.answered())});
 document.getElementById('pc').textContent=n+'/'+S.qs.length;document.getElementById('pf').style.width=(100*n/S.qs.length)+'%';
}
const L4='ABCD';
function renderQ(q,i,host,pre){
 const id=pre+i,card=h('section','q',`<div class="qh"><b class="qn">Câu ${i+1}</b><span class="tp">${TOPICS[q.topic].icon} ${TOPICS[q.topic].name}</span></div><p class="qt">${q.text}</p>${q.svg||''}<div class="qb"></div><div class="fb"></div>`);
 const b=card.querySelector('.qb');q.card=card;card.id='qc_'+id;
 if(q.kind=='mcq'){
  q.opts.forEach((o,k)=>b.append(h('label','opt',`<input type="radio" name="${id}" value="${k}"><span class="lt">${L4[k]}</span><span>${o.t}</span>`)));
  q.read=()=>{const c=b.querySelector('input:checked');return c?+c.value:null};
  q.answered=()=>q.read()!==null;
  q.grade=()=>{const u=q.read();return{score:u===q.ans?1:0,user:u}};
 }else if(q.kind=='pick'){
  const w=h('div','pick');q.items.forEach((t,k)=>w.append(h('label','opt',`<input type="checkbox" value="${k}"><span>${t}</span>`)));b.append(w);
  q.read=()=>[...w.querySelectorAll('input:checked')].map(x=>+x.value);
  q.answered=()=>q.read().length>0;
  q.grade=()=>{const u=q.read(),hit=u.filter(x=>q.ans.includes(x)).length,wrong=u.length-hit;return{score:Math.max(0,(hit-wrong)/q.ans.length),user:u}};
 }else if(q.kind=='tf'){
  q.items.forEach((it,k)=>b.append(h('div','tfrow',`<span class="tt">${'ab'[k]}) ${it.text}</span><label class="opt"><input type="radio" name="${id}_${k}" value="1"><span>Đ</span></label><label class="opt"><input type="radio" name="${id}_${k}" value="0"><span>S</span></label>`)));
  q.read=()=>q.items.map((_,k)=>{const c=b.querySelector(`input[name="${id}_${k}"]:checked`);return c?c.value=='1':null});
  q.answered=()=>q.read().every(x=>x!==null);
  q.grade=()=>{const u=q.read();return{score:u.filter((x,k)=>x===q.items[k].ans).length/q.items.length,user:u}};
 }else{
  q.fields.forEach((f,k)=>{
   const row=h('div','frow');
   if(f.sign){row.innerHTML=`<span>${f.pre}</span><select data-k="${k}"><option value="">?</option><option>&gt;</option><option>&lt;</option><option>=</option></select><span>${f.post}</span>`}
   else row.innerHTML=`${f.label?`<span>${f.label}:</span>`:''}<input inputmode="numeric" autocomplete="off" data-k="${k}" placeholder="…"><span>${f.unit||''}</span>`;
   b.append(row);});
  q.read=()=>[...b.querySelectorAll('[data-k]')].map(x=>x.value.trim());
  q.answered=()=>q.read().every(x=>x!=='');
  q.grade=()=>{const u=q.read();return{score:u.filter((x,k)=>q.fields[k].sign?x===q.fields[k].ans:norm(x)===norm(q.fields[k].ans)).length/q.fields.length,user:u}};
 }
 host.append(card);
}
function reveal(q,g){
 const card=q.card,fb=card.querySelector('.fb'),b=card.querySelector('.qb');
 const cls=g.score>=.999?'ok':g.score<=0?'bad':'part';card.classList.add(cls);b.classList.add('locked');
 const head=cls=='ok'?'✅ Chính xác! Giỏi lắm!':cls=='bad'?'❌ Chưa đúng. Cùng xem lý do nhé:':`🟡 Đúng một phần (${Math.round(g.score*100)}%). Xem phần còn thiếu:`;
 let det='';
 if(q.kind=='mcq'){
  const labs=b.querySelectorAll('.opt');labs[q.ans].classList.add('right');
  if(g.user!==null&&g.user!==q.ans)labs[g.user].classList.add('wrong');
  det=g.user===null?`<p>Em chưa chọn đáp án.</p>`:g.user!==q.ans?`<p>Em chọn <b>${L4[g.user]}. ${q.opts[g.user].t}</b>: ${q.opts[g.user].why}</p>`:'';
  det+=`<p>✔ Đáp án đúng <b>${L4[q.ans]}. ${q.opts[q.ans].t}</b>: ${q.opts[q.ans].why}</p>`;
  det+=`<details><summary>Vì sao các đáp án khác sai?</summary><ul>${q.opts.map((o,k)=>k==q.ans?'':`<li><b>${L4[k]}. ${o.t}</b> – ${o.why}</li>`).join('')}</ul></details>`;
 }else if(q.kind=='pick'){
  const labs=b.querySelectorAll('.opt');
  labs.forEach((l,k)=>{const sel=g.user.includes(k),should=q.ans.includes(k);if(sel&&should)l.classList.add('right');else if(sel)l.classList.add('wrong');else if(should)l.classList.add('missed')});
  det=`<p>Màu xanh: chọn đúng · Màu đỏ: chọn nhầm · Viền cam: bị bỏ sót.</p>`;
 }else if(q.kind=='tf'){
  det='<ul>'+q.items.map((it,k)=>{const u=g.user[k],ok=u===it.ans;return`<li>${'ab'[k]}) ${ok?'✔':'✘'} Em chọn ${u===null?'(bỏ trống)':u?'Đ':'S'}; đáp án <b>${it.ans?'Đ':'S'}</b>. ${it.why}</li>`}).join('')+'</ul>';
 }else{
  const els=b.querySelectorAll('[data-k]');
  det='<ul>'+q.fields.map((f,k)=>{const ok=f.sign?g.user[k]===f.ans:norm(g.user[k])===norm(f.ans);els[k].classList.add(ok?'ok':'bad');els[k].disabled=true;
   return`<li>${ok?'✔':'✘'} ${f.sign?f.pre+' … '+f.post:(f.label||'Kết quả')}: em điền <b>${g.user[k]||'(trống)'}</b>${ok?'':` → đáp án <b>${f.sign?f.ans:fmt(f.ans)}${f.unit?' '+f.unit:''}</b>`}${f.why?` — ${f.why}`:''}</li>`}).join('')+'</ul>';
 }
 fb.innerHTML=`<div class="verdict">${head}</div>${det}<div class="ex">💡 <b>Giải thích:</b> ${q.explain}</div>`;
}
function summarize(qs,gs){
 const t={};qs.forEach((q,i)=>{const o=t[q.topic]||(t[q.topic]={got:0,n:0});o.got+=gs[i].score;o.n++});return t;
}
function submit(auto){
 const un=S.qs.filter(q=>!q.answered()).length;
 if(!auto&&un&&!confirm(`Còn ${un} câu chưa làm xong. Em vẫn muốn nộp bài chứ?`))return;
 S.done=true;clearInterval(S.timer);S.elapsed=Math.min(S.allowed,Math.round((Date.now()-S.t0)/1000));S.timeout=!!auto;
 const gs=S.qs.map(q=>q.grade());S.qs.forEach((q,i)=>reveal(q,gs[i]));
 const total=gs.reduce((a,g)=>a+g.score,0),score=Math.round(total/S.qs.length*100)/10;
 const prev=best(S.ex.id);const nb=[];if(prev==null)nb.push('first');else if(score>prev)nb.push('improve');if(score>=9)nb.push('pro');if(score>=10)nb.push('full');if(!best(S.ex.id)||score>best(S.ex.id))localStorage.setItem(UK('best_'+S.ex.id),score);
 const t=summarize(S.qs,gs);Object.keys(t).forEach(k=>{if(t[k].got>=t[k].n-.001)nb.push('m_'+k)});if(EXAMS.every(e=>best(e.id)!=null))nb.push('all');const newB=award(nb);sendResult(score,t);const keys=Object.keys(t).map(k=>({k,p:t[k].got/t[k].n}));
 const good=keys.filter(x=>x.p>=.8),mid=keys.filter(x=>x.p>=.5&&x.p<.8),low=keys.filter(x=>x.p<.5),weak=low.concat(mid);
 const msg=score>=9?'🏆 Xuất sắc! Em thật tuyệt vời!':score>=8?'🌟 Giỏi lắm! Chỉ cần chú ý thêm một chút nữa thôi.':score>=6.5?'👍 Khá tốt! Em hãy xem lại các phần bên dưới.':score>=5?'🙂 Em đã cố gắng! Hãy ôn lại những phần còn yếu nhé.':'💪 Đừng nản! Đọc lời giải và luyện tập thêm, em sẽ tiến bộ nhanh thôi.';
 const row=x=>{const c=x.p>=.8?'good':x.p>=.5?'mid':'low',lb=x.p>=.8?'Tốt':x.p>=.5?'Cần chú ý':'Cần ôn thêm';return`<div class="tbar ${c}"><span class="nm">${TOPICS[x.k].icon} ${TOPICS[x.k].name}</span><div class="tr"><i style="width:${Math.max(4,x.p*100)}%"></i></div><span class="tag">${lb} · ${Math.round(t[x.k].got*10)/10}/${t[x.k].n}</span></div>`};
 const res=h('div','result',`<div class="score"><div class="circle" style="--p:${score*10}"><b>${score}</b><span>/ 10 điểm</span></div><div><h2 style="margin:0">${msg}</h2><p style="margin:4px 0">Đúng hoàn toàn: ${gs.filter(g=>g.score>=.999).length}/${S.qs.length} câu · 🏆 Điểm cao nhất: ${best(S.ex.id)}/10</p><p style="margin:4px 0">⏱ Thời gian làm bài: <b>${fmtDur(S.elapsed)}</b> / ${Math.round(S.allowed/60)} phút${S.timeout?' – <b>⏰ Hết giờ, bài được tự nộp</b>':''}</p></div></div>
 <h3>📊 Kết quả theo từng phần</h3>${keys.map(row).join('')}
 ${good.length?`<div class="panel g"><b>😀 Em làm tốt:</b> ${good.map(x=>TOPICS[x.k].name).join('; ')}. Hãy tiếp tục giữ vững nhé!</div>`:''}
 ${weak.length?`<div class="panel w"><b>🧐 Em cần rút kinh nghiệm:</b><ul>${weak.map(x=>`<li><b>${TOPICS[x.k].name}:</b> ${TOPICS[x.k].tip}</li>`).join('')}</ul></div>`:'<div class="panel g">🎉 Không có phần nào yếu! Em có thể thử Đề khác hoặc làm lại với số liệu mới.</div>'}
 <p>⭐ Sao của đề này: <span class="star">${starTxt(stars(best(S.ex.id)))}</span> (5 điểm: 1 sao · 7 điểm: 2 sao · 9 điểm: 3 sao)</p>${newB.length?`<div class="newb"><b>🎉 Em vừa nhận huy hiệu mới!</b><div>${badgeHTML(newB,false)}</div></div>`:''}<p>👇 Kéo xuống để xem lời giải từng câu. Câu nào sai sẽ có giải thích vì sao em chọn chưa đúng.</p>
 <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn orange" id="again">🔁 Làm lại với số liệu mới</button><button class="btn ghost" id="toHome">🏠 Chọn đề khác</button></div>`);
 app.insertBefore(res,document.getElementById('qs'));
 document.querySelector('.bar').remove();document.body.classList.remove('has-nav');document.querySelector('.sub').remove();
 res.querySelector('#again').onclick=()=>start(S.ex,S.variant+1);res.querySelector('#toHome').onclick=home;
 if(weak.length)buildPractice(weak);
 window.scrollTo({top:0,behavior:'smooth'});
}
function buildPractice(weak){
 const box=h('div','practice',`<h3>🎒 Bài tập củng cố dành riêng cho em</h3><p>Dựa trên những phần em còn yếu. Làm xong bấm <b>Chấm bài luyện tập</b>.</p><div id="pq"></div><div class="sub" style="margin:12px 0 0;gap:10px"><button class="btn green" id="pcheck">Chấm bài luyện tập</button></div><div id="pres"></div>`);
 app.append(box);
 function gen(){
  const r=rng(Date.now()%1e9),qs=[];
  weak.forEach(x=>{const n=x.p<.5?3:2,gens=GENS[x.k];for(let i=0;i<n;i++)qs.push(gens[i%gens.length](rng(R(r,1,1e9)),undefined))});
  const pq=box.querySelector('#pq');pq.innerHTML='';box.querySelector('#pres').innerHTML='';
  qs.forEach((q,i)=>renderQ(q,i,pq,'p'));box.qs=qs;box.querySelector('#pcheck').style.display='';
 }
 gen();
 box.querySelector('#pcheck').onclick=()=>{
  const gs=box.qs.map(q=>q.grade());box.qs.forEach((q,i)=>reveal(q,gs[i]));
  const ok=gs.reduce((a,g)=>a+g.score,0),n=box.qs.length;
  box.querySelector('#pcheck').style.display='none';
  const pr=box.querySelector('#pres');pr.innerHTML=`${ok/n>=.7&&award(['practice']).length?'<div class="newb"><b>🎉 Huy hiệu mới!</b><div>'+badgeHTML(['practice'],false)+'</div></div>':''}<div class="panel ${ok/n>=.7?'g':'w'}"><b>Kết quả luyện tập: ${Math.round(ok*10)/10}/${n}</b> — ${ok/n>=.7?'Tiến bộ rõ rệt! 🎉':'Hãy đọc kĩ lời giải rồi thử bộ mới nhé 💪'}</div><button class="btn orange" id="more">🔄 Luyện thêm bộ câu hỏi mới</button>`;
  pr.querySelector('#more').onclick=gen;
 };
}
const syncH=()=>{const hd=document.querySelector('header.top');if(hd)document.documentElement.style.setProperty('--hh',hd.offsetHeight+'px')};
window.addEventListener('resize',syncH);setTimeout(syncH,50);
boot();syncH();
</script>
